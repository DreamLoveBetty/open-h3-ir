name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -e ".[dev]"

      # The static control gate: MiniMax's own published example must validate clean, and
      # sixteen mutants of it must each trip a named rule. No model, no GPU, no network.
      - name: control gate
        run: h3ir controls

      - name: tests
        run: pytest -q

      # An installed copy must find its own prompt templates and golden files. This catches a
      # data file left out of the package, which an editable install cannot see.
      - name: installed copy works outside the source tree
        run: |
          pip install --force-reinstall --no-deps .
          cd "$(mktemp -d)"
          h3ir controls
          h3ir budget --seconds 10
