[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `open-h3-ir`; the import package and the command are both `h3ir`, which is
# what you actually type. Stated in the README install block so nobody has to discover it.
name = "open-h3-ir"
version = "0.1.0"
description = "An open implementation of MiniMax H3's closed Context-IR stage. One sentence in, a validated H3 video brief out, with the asset wiring it is true for."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["minimax-h3", "minimax", "h3", "context-ir", "video-generation",
            "prompt-compiler", "comfyui", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "tiktoken",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
h3ir = "h3ir.cli:main"

[tool.setuptools]
# Explicit, so the golden files and prompt templates cannot be silently left out of an install.
packages = ["h3ir", "h3ir.evalloop"]

[tool.setuptools.package-data]
h3ir = [
  "prompts/*.txt",
  "golden/*.txt",
  "golden/assets/*",
  "data/qwen25_tokenizer/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
