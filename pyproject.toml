[build-system]
# 77 is the floor for PEP 639, which is what `license = "Apache-2.0"` below needs. An older
# setuptools does not understand the SPDX string form and fails the build rather than warning.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is `open-h3-ir`; the import package and the command are both `h3ir`, which is
# what you actually type. Stated in the README install block so nobody has to discover it.
name = "open-h3-ir"
version = "0.1.0"
description = "Open-source local implementation of MiniMax H3 Context-IR. Turn simple prompts into structured, validated H3 video briefs."
readme = "README.md"
requires-python = ">=3.10"
# SPDX expression, not the old `License :: OSI Approved ::` classifier. PEP 639 replaced that
# classifier and setuptools rejects a project that declares both.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["minimax-h3", "minimax", "h3", "context-ir", "video-generation",
            "prompt-compiler", "comfyui", "local-llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "httpx",
  "tiktoken",
]

[project.optional-dependencies]
# numpy is here for the ComfyUI node's tests only. The node converts IMAGE tensors to files, and
# that conversion is where a silent resize or a dropped channel would hide, so it gets tested rather
# than skipped. Nothing in `h3ir` itself imports numpy, and ComfyUI already ships it at runtime.
dev = ["pytest", "numpy"]

[project.urls]
# The package page's sidebar is built from these, and without them the only way back to the repo is a
# link inside the README's own text. They reach the page on the next release, not this one: a
# version's metadata is as frozen as its description once it is uploaded.
Homepage = "https://github.com/ruashots/open-h3-ir"
Documentation = "https://github.com/ruashots/open-h3-ir#readme"
Issues = "https://github.com/ruashots/open-h3-ir/issues"

[project.scripts]
h3ir = "h3ir.cli:main"

[tool.setuptools]
# Explicit, so the golden files and prompt templates cannot be silently left out of an install.
packages = ["h3ir", "h3ir.evalloop"]

[tool.setuptools.package-data]
h3ir = [
  "prompts/*.txt",
  "golden/*.txt",
  "golden/assets/*",
  "data/qwen25_tokenizer/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
